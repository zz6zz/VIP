<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام إدارة العيادات الطبية | كلينك برو</title>
<style>
/* ============ المتغيرات والثيم ============ */
:root{
  --primary:#0ea5e9;
  --primary-dark:#0369a1;
  --primary-light:#e0f2fe;
  --secondary:#10b981;
  --secondary-dark:#059669;
  --danger:#ef4444;
  --warning:#f59e0b;
  --info:#8b5cf6;
  --dark:#0f172a;
  --dark-2:#1e293b;
  --gray:#64748b;
  --gray-light:#94a3b8;
  --bg:#f1f5f9;
  --card:#ffffff;
  --border:#e2e8f0;
  --text:#0f172a;
  --text-muted:#64748b;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
  --shadow-lg:0 10px 30px rgba(0,0,0,.12);
  --radius:14px;
  --sidebar-w:260px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Segoe UI',Tahoma,'Cairo',Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
}
/* ============ الشريط الجانبي ============ */
.sidebar{
  position:fixed;top:0;right:0;bottom:0;width:var(--sidebar-w);
  background:linear-gradient(180deg,#0f172a 0%,#1e293b 100%);
  color:#fff;z-index:100;transition:transform .3s ease;
  display:flex;flex-direction:column;
}
.sidebar-header{
  padding:22px 20px;display:flex;align-items:center;gap:12px;
  border-bottom:1px solid rgba(255,255,255,.08);
}
.logo-icon{
  width:44px;height:44px;border-radius:12px;
  background:linear-gradient(135deg,var(--primary),var(--info));
  display:flex;align-items:center;justify-content:center;font-size:22px;
  box-shadow:0 4px 12px rgba(14,165,233,.4);
}
.logo-text h3{font-size:16px;font-weight:700}
.logo-text p{font-size:11px;color:var(--gray-light);margin-top:2px}
.nav{flex:1;padding:16px 12px;overflow-y:auto}
.nav-group{font-size:11px;color:var(--gray-light);padding:14px 12px 6px;letter-spacing:.5px}
.nav-item{
  display:flex;align-items:center;gap:12px;padding:11px 12px;margin:2px 0;
  border-radius:10px;cursor:pointer;color:#cbd5e1;font-size:14px;
  transition:all .2s;border:none;background:none;width:100%;text-align:right;
}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item.active{
  background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  color:#fff;box-shadow:0 4px 12px rgba(14,165,233,.35);
}
.nav-item .ic{font-size:18px;width:24px;text-align:center}
.nav-item .badge{
  margin-right:auto;background:var(--danger);color:#fff;font-size:10px;
  padding:2px 7px;border-radius:20px;font-weight:700;
}
.sidebar-footer{padding:16px;border-top:1px solid rgba(255,255,255,.08)}
.user-box{display:flex;align-items:center;gap:10px}
.user-avatar{
  width:38px;height:38px;border-radius:50%;
  background:linear-gradient(135deg,var(--secondary),var(--primary));
  display:flex;align-items:center;justify-content:center;font-weight:700;
}
.user-box .nm{font-size:13px;font-weight:600}
.user-box .rl{font-size:11px;color:var(--gray-light)}
/* ============ المحتوى الرئيسي ============ */
.main{margin-right:var(--sidebar-w);padding:20px 24px;min-height:100vh}
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:22px;gap:16px;flex-wrap:wrap;
}
.topbar h1{font-size:22px;font-weight:700}
.topbar .sub{color:var(--text-muted);font-size:13px;margin-top:3px}
.topbar-actions{display:flex;align-items:center;gap:12px}
.search-box{
  display:flex;align-items:center;gap:8px;background:var(--card);
  border:1px solid var(--border);border-radius:10px;padding:9px 14px;min-width:240px;
}
.search-box input{border:none;outline:none;font-size:13px;width:100%;background:transparent}
.icon-btn{
  width:40px;height:40px;border-radius:10px;border:1px solid var(--border);
  background:var(--card);cursor:pointer;font-size:17px;position:relative;
  display:flex;align-items:center;justify-content:center;transition:all .2s;
}
.icon-btn:hover{background:var(--primary-light);border-color:var(--primary)}
.icon-btn .dot{
  position:absolute;top:8px;left:8px;width:8px;height:8px;border-radius:50%;
  background:var(--danger);border:2px solid #fff;
}
/* ============ البطاقات ============ */
.card{
  background:var(--card);border-radius:var(--radius);border:1px solid var(--border);
  box-shadow:var(--shadow);padding:20px;margin-bottom:20px;
}
.card-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:16px;flex-wrap:wrap;gap:10px;
}
.card-header h3{font-size:16px;font-weight:700}
.card-header .hint{font-size:12px;color:var(--text-muted)}
/* ============ بطاقات الإحصائيات ============ */
.stats-grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:16px;margin-bottom:20px;
}
.stat-card{
  background:var(--card);border-radius:var(--radius);border:1px solid var(--border);
  padding:18px;box-shadow:var(--shadow);position:relative;overflow:hidden;
  transition:transform .2s;
}
.stat-card:hover{transform:translateY(-3px)}
.stat-card .stat-ic{
  width:44px;height:44px;border-radius:12px;display:flex;align-items:center;
  justify-content:center;font-size:20px;margin-bottom:12px;
}
.stat-card .stat-val{font-size:26px;font-weight:800}
.stat-card .stat-lbl{font-size:13px;color:var(--text-muted);margin-top:2px}
.stat-card .stat-trend{font-size:11px;margin-top:8px;font-weight:600}
.trend-up{color:var(--secondary)}
.trend-down{color:var(--danger)}
.ic-blue{background:var(--primary-light);color:var(--primary)}
.ic-green{background:#d1fae5;color:var(--secondary)}
.ic-purple{background:#ede9fe;color:var(--info)}
.ic-orange{background:#fef3c7;color:var(--warning)}
.ic-red{background:#fee2e2;color:var(--danger)}
/* ============ الجداول ============ */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{
  text-align:right;padding:12px 14px;color:var(--text-muted);font-weight:600;
  border-bottom:2px solid var(--border);white-space:nowrap;font-size:12px;
}
tbody td{padding:12px 14px;border-bottom:1px solid var(--border);white-space:nowrap}
tbody tr:hover{background:#f8fafc}
tbody tr:last-child td{border-bottom:none}
.avatar-sm{
  width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;
  justify-content:center;font-weight:700;font-size:12px;color:#fff;margin-left:8px;
}
.cell-user{display:flex;align-items:center}
.cell-user .nm{font-weight:600}
.cell-user .sb{font-size:11px;color:var(--text-muted)}
.status{
  padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700;display:inline-block;
}
.status.confirmed{background:#d1fae5;color:var(--secondary-dark)}
.status.pending{background:#fef3c7;color:#b45309}
.status.cancelled{background:#fee2e2;color:var(--danger)}
.status.active{background:#dbeafe;color:var(--primary-dark)}
.status.inactive{background:#f1f5f9;color:var(--gray)}
/* ============ الأزرار ============ */
.btn{
  padding:9px 18px;border-radius:10px;border:none;cursor:pointer;font-size:13px;
  font-weight:600;transition:all .2s;display:inline-flex;align-items:center;gap:6px;
}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark)}
.btn-secondary{background:var(--secondary);color:#fff}
.btn-secondary:hover{background:var(--secondary-dark)}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-outline:hover{border-color:var(--primary);color:var(--primary)}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover{background:#dc2626}
.btn-success{background:var(--secondary);color:#fff}
.btn-success:hover{background:var(--secondary-dark)}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-icon{
  width:32px;height:32px;padding:0;border-radius:8px;justify-content:center;font-size:14px;
}
/* ============ النماذج ============ */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-group{display:flex;flex-direction:column;gap:6px}
.form-group.full{grid-column:1/-1}
.form-group label{font-size:12px;font-weight:600;color:var(--text-muted)}
.form-group input,.form-group select,.form-group textarea{
  padding:10px 12px;border:1px solid var(--border);border-radius:10px;font-size:13px;
  outline:none;transition:border .2s;font-family:inherit;background:#fff;
}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{
  border-color:var(--primary);box-shadow:0 0 0 3px rgba(14,165,233,.12);
}
.form-group textarea{resize:vertical;min-height:70px}
.form-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
/* ============ النوافذ المنبثقة ============ */
.modal-overlay{
  position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:200;
  display:none;align-items:center;justify-content:center;backdrop-filter:blur(3px);
}
.modal-overlay.show{display:flex}
.modal{
  background:#fff;border-radius:16px;width:90%;max-width:560px;max-height:90vh;
  overflow-y:auto;box-shadow:var(--shadow-lg);animation:modalIn .25s ease;
}
.modal-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 22px;border-bottom:1px solid var(--border);
}
.modal-header h3{font-size:16px;font-weight:700}
.modal-close{
  width:32px;height:32px;border-radius:8px;border:none;background:var(--bg);
  cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;
}
.modal-body{padding:22px}
@keyframes modalIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
/* ============ التنبيهات ============ */
.toast{
  position:fixed;bottom:24px;left:24px;background:var(--dark);color:#fff;
  padding:14px 22px;border-radius:12px;font-size:14px;z-index:300;
  box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:10px;
  transform:translateY(100px);opacity:0;transition:all .3s;
}
.toast.show{transform:translateY(0);opacity:1}
.toast.success{background:var(--secondary)}
.toast.error{background:var(--danger)}
/* ============ الرسوم البيانية ============ */
.chart-grid{display:grid;grid-template-columns:2fr 1fr;gap:16px}
.chart-box{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);padding:18px;box-shadow:var(--shadow)}
.chart-box h4{font-size:14px;margin-bottom:14px}
.bar-chart{display:flex;align-items:flex-end;gap:10px;height:180px;padding-top:10px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bar{
  width:100%;max-width:46px;border-radius:8px 8px 0 0;
  background:linear-gradient(180deg,var(--primary),var(--primary-dark));
  transition:height .5s ease;position:relative;min-height:4px;
}
.bar:hover{filter:brightness(1.1)}
.bar .val{position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:700;color:var(--text)}
.bar-lbl{font-size:11px;color:var(--text-muted)}
.donut-wrap{display:flex;align-items:center;justify-content:center;gap:20px;flex-wrap:wrap}
.donut{width:150px;height:150px;border-radius:50%;position:relative}
.donut-center{
  position:absolute;inset:14px;background:#fff;border-radius:50%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.donut-center .v{font-size:22px;font-weight:800}
.donut-center .l{font-size:11px;color:var(--text-muted)}
.legend{display:flex;flex-direction:column;gap:8px}
.legend-item{display:flex;align-items:center;gap:8px;font-size:13px}
.legend-dot{width:12px;height:12px;border-radius:4px}
/* ============ قائمة المهام ============ */
.todo-list{display:flex;flex-direction:column;gap:10px}
.todo-item{
  display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--border);
  border-radius:10px;transition:all .2s;cursor:pointer;
}
.todo-item:hover{border-color:var(--primary);background:var(--primary-light)}
.todo-item.done{opacity:.6}
.todo-item.done .todo-text{text-decoration:line-through}
.todo-check{
  width:22px;height:22px;border-radius:6px;border:2px solid var(--border);
  display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;flex-shrink:0;
}
.todo-item.done .todo-check{background:var(--secondary);border-color:var(--secondary)}
.todo-text{flex:1;font-size:13px}
.todo-time{font-size:11px;color:var(--text-muted)}
/* ============ الفلاتر ============ */
.filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.filter-chip{
  padding:7px 16px;border-radius:20px;border:1px solid var(--border);background:#fff;
  cursor:pointer;font-size:12px;font-weight:600;color:var(--text-muted);transition:all .2s;
}
.filter-chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.filter-chip:hover{border-color:var(--primary)}
/* ============ التبويبات ============ */
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--border);margin-bottom:18px;overflow-x:auto}
.tab{
  padding:10px 18px;cursor:pointer;font-size:13px;font-weight:600;color:var(--text-muted);
  border-bottom:2px solid transparent;margin-bottom:-2px;white-space:nowrap;transition:all .2s;
}
.tab.active{color:var(--primary);border-bottom-color:var(--primary)}
/* ============ الشبكات ============ */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:900px){.grid-2,.grid-3,.chart-grid{grid-template-columns:1fr}}
/* ============ بطاقات الأطباء ============ */
.doc-card{
  background:var(--card);border-radius:var(--radius);border:1px solid var(--border);
  padding:18px;text-align:center;box-shadow:var(--shadow);transition:all .2s;
}
.doc-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.doc-avatar{
  width:64px;height:64px;border-radius:50%;margin:0 auto 12px;
  background:linear-gradient(135deg,var(--primary),var(--info));
  display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff;
}
.doc-card h4{font-size:15px;margin-bottom:4px}
.doc-card .sp{font-size:12px;color:var(--primary);font-weight:600;margin-bottom:10px}
.doc-card .meta{font-size:11px;color:var(--text-muted);margin-bottom:12px}
/* ============ شارات ============ */
.badge{
  display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;
}
.badge-blue{background:#dbeafe;color:var(--primary-dark)}
.badge-green{background:#d1fae5;color:var(--secondary-dark)}
.badge-purple{background:#ede9fe;color:var(--info)}
.badge-orange{background:#fef3c7;color:#b45309}
/* ============ لوحة الذكاء الاصطناعي ============ */
.ai-hero{
  background:linear-gradient(135deg,#0f172a,#1e293b);border-radius:var(--radius);
  padding:28px;color:#fff;margin-bottom:20px;position:relative;overflow:hidden;
}
.ai-hero::after{
  content:'';position:absolute;top:-40px;left:-40px;width:200px;height:200px;
  background:radial-gradient(circle,rgba(139,92,246,.3),transparent 70%);
}
.ai-hero h2{font-size:20px;margin-bottom:8px}
.ai-hero p{color:#94a3b8;font-size:13px;max-width:600px}
.ai-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.ai-card{
  background:var(--card);border-radius:var(--radius);border:1px solid var(--border);
  padding:20px;box-shadow:var(--shadow);transition:all .2s;
}
.ai-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.ai-card .ai-ic{
  width:46px;height:46px;border-radius:12px;display:flex;align-items:center;
  justify-content:center;font-size:22px;margin-bottom:14px;
}
.ai-card h4{font-size:15px;margin-bottom:6px}
.ai-card p{font-size:12px;color:var(--text-muted);line-height:1.6;margin-bottom:14px}
.ai-card .ai-stat{font-size:22px;font-weight:800;color:var(--primary)}
.ai-card .ai-stat-label{font-size:11px;color:var(--text-muted)}
/* ============ شريط التقدم ============ */
.progress{background:var(--bg);border-radius:20px;height:8px;overflow:hidden}
.progress-bar{height:100%;border-radius:20px;background:linear-gradient(90deg,var(--primary),var(--info));transition:width .5s}
/* ============ الإشعارات ============ */
.notif-panel{
  position:fixed;top:0;left:0;bottom:0;width:340px;background:#fff;z-index:250;
  box-shadow:var(--shadow-lg);transform:translateX(-100%);transition:transform .3s;
  display:flex;flex-direction:column;
}
.notif-panel.open{transform:translateX(0)}
.notif-header{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.notif-list{flex:1;overflow-y:auto;padding:12px}
.notif-item{display:flex;gap:12px;padding:12px;border-radius:10px;transition:background .2s;cursor:pointer}
.notif-item:hover{background:var(--bg)}
.notif-item.unread{background:var(--primary-light)}
.notif-ic{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.notif-item .t{font-size:13px;font-weight:600}
.notif-item .d{font-size:11px;color:var(--text-muted);margin-top:2px}
/* ============ استجابة ============ */
.menu-toggle{display:none}
@media(max-width:768px){
  .sidebar{transform:translateX(100%)}
  .sidebar.open{transform:translateX(0)}
  .main{margin-right:0;padding:16px}
  .menu-toggle{display:flex}
  .stats-grid{grid-template-columns:repeat(2,1fr)}
  .form-grid{grid-template-columns:1fr}
  .search-box{min-width:100%}
}
/* ============ صفحة فارغة / حالة ============ */
.empty-state{text-align:center;padding:40px 20px;color:var(--text-muted)}
.empty-state .ic{font-size:48px;margin-bottom:12px}
.empty-state p{font-size:14px}
/* ============ بطاقة المريض ============ */
.patient-hero{
  background:linear-gradient(135deg,var(--primary),var(--info));border-radius:var(--radius);
  padding:24px;color:#fff;margin-bottom:20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;
}
.patient-hero .big-avatar{
  width:70px;height:70px;border-radius:50%;background:rgba(255,255,255,.2);
  display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;
}
.patient-hero h2{font-size:20px}
.patient-hero .meta{font-size:12px;opacity:.9;margin-top:4px}
.patient-hero .actions{margin-right:auto;display:flex;gap:8px}
/* ============ المؤشرات الحيوية ============ */
.vitals-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.vital-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;text-align:center}
.vital-card .v{font-size:20px;font-weight:800;color:var(--primary)}
.vital-card .l{font-size:11px;color:var(--text-muted);margin-top:4px}
</style>
</head>
<body>
<!-- ============ الشريط الجانبي ============ -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <div class="logo-icon">🏥</div>
    <div class="logo-text">
      <h3>كلينك برو</h3>
      <p>نظام إدارة العيادات</p>
    </div>
  </div>
  <nav class="nav" id="navMenu"></nav>
  <div class="sidebar-footer">
    <div class="user-box">
      <div class="user-avatar">د</div>
      <div>
        <div class="nm">د. حوراء حاكم </div>
        <div class="rl">مدير العيادة</div>
      </div>
    </div>
  </div>
</aside>

<!-- ============ المحتوى ============ -->
<main class="main">
  <div class="topbar">
    <div>
      <h1 id="pageTitle">لوحة التحكم</h1>
      <div class="sub" id="pageSub">نظرة عامة على نشاط العيادة</div>
    </div>
    <div class="topbar-actions">
      <button class="menu-toggle icon-btn" onclick="toggleSidebar()">☰</button>
      <div class="search-box">
        <span>🔍</span>
        <input type="text" placeholder="بحث سريع..." id="globalSearch" oninput="globalSearchFn(this.value)">
      </div>
      <button class="icon-btn" onclick="toggleNotif()">🔔<span class="dot"></span></button>
      <button class="btn btn-primary" onclick="quickAction()">+ إجراء سريع</button>
    </div>
  </div>
  <div id="pageContent"></div>
</main>

<!-- ============ النافذة المنبثقة ============ -->
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modalTitle">عنوان</h3>

  if(results.length){
    openModal('نتائج البحث', `
      <div class="table-wrap"><table>
        <thead><tr><th>المريض</th><th>الحالة</th><th>الطبيب</th><th></th></tr></thead>

            <td><div class="cell-user"><span class="avatar-sm" style="background:${p.color}">${p.name[0]}</span><div><div class="nm">${p.name}</div><div class="sb">${p.disease}</div></div></div></td>

            <td>${d.name}</td>

          </tr>`;}).join('')}
        </tbody>
      </table></div>
    `);
  } else {

}

function renderDashboard(){
  const totalRevenue = invoices.filter(i=>i.status==='مدفوعة').reduce((s,i)=>s+i.total,0);
  const todayAppts = appointments.filter(a=>a.date===today()).length;
  const lowStock = medicines.filter(m=>m.stock<=m.min).length;
  const weekData = [
    {d:'السبت', v:12},{d:'الأحد', v:18},{d:'الاثنين', v:15},{d:'الثلاثاء', v:22},{d:'الأربعاء', v:19},{d:'الخميس', v:25},{d:'الجمعة', v:8}
  ];
  const maxV = Math.max(...weekData.map(w=>w.v));
  const donutData = [
    {label:'مدفوعة', val:invoices.filter(i=>i.status==='مدفوعة').length, color:'#10b981'},
    {label:'معلقة', val:invoices.filter(i=>i.status==='معلقة').length, color:'#f59e0b'},
    {label:'غير مدفوعة', val:invoices.filter(i=>i.status==='غير مدفوعة').length, color:'#ef4444'}
  ];
  const totalInv = donutData.reduce((s,d)=>s+d.val,0);
  let acc = 0;
  const donutGrad = donutData.map(d=>{
    const from = acc/totalInv*360, to = (acc+d.val)/totalInv*360;
    acc += d.val;
    return `${d.color} ${from}deg ${to}deg`;
  }).join(', ');
  $('#pageContent').innerHTML = `
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-ic ic-blue">👥</div><div class="stat-val">${patients.length}</div><div class="stat-lbl">إجمالي المرضى</div><div class="stat-trend trend-up">▲ 12% هذا الشهر</div></div>

      <div class="stat-card"><div class="stat-ic ic-purple">💰</div><div class="stat-val">${fmt(totalRevenue)}</div><div class="stat-lbl">إيرادات مدفوعة (د.ع)</div><div class="stat-trend trend-up">▲ 8% عن الشهر الماضي</div></div>
      <div class="stat-card"><div class="stat-ic ic-orange">💊</div><div class="stat-val">${lowStock}</div><div class="stat-lbl">أدوية منخفضة المخزون</div><div class="stat-trend trend-down">▼ تحتاج إعادة طلب</div></div>
    </div>
    <div class="chart-grid">
      <div class="chart-box">
        <h4>📊 المواعيد خلال الأسبوع</h4>
        <div class="bar-chart">
          ${weekData.map(w=>`<div class="bar-col"><div class="bar" style="height:${w.v/maxV*100}%"><span class="val">${w.v}</span></div><div class="bar-lbl">${w.d}</div></div>`).join('')}
        </div>
      </div>
      <div class="chart-box">
        <h4>💳 حالة الفواتير</h4>
        <div class="donut-wrap">
          <div class="donut" style="background:conic-gradient(${donutGrad})">
            <div class="donut-center"><div class="v">${totalInv}</div><div class="l">فاتورة</div></div>
          </div>
          <div class="legend">${donutData.map(d=>`<div class="legend-item"><span class="legend-dot" style="background:${d.color}"></span>${d.label} (${d.val})</div>`).join('')}</div>
        </div>
      </div>
    </div>
    <div class="grid-2">
      <div class="card">
        <div class="card-header"><h3>📅 مواعيد اليوم</h3><button class="btn btn-sm btn-primary" onclick="navigate('appointments')">عرض الكل</button></div>

          <thead><tr><th>المريض</th><th>الطبيب</th><th>الوقت</th><th>الحالة</th></tr></thead>
          <tbody>
          ${appointments.filter(a=>a.date===today()).map(a=>{const p=patientById(a.patient), d=doctorById(a.doctor);return `<tr><td><div class="cell-user"><span class="avatar-sm" style="background:${p.color}">${p.name[0]}</span><span class="nm">${p.name}</span></div></td><td>${d.name}</td><td>${a.time}</td><td><span class="status ${a.status==='مؤكد'?'confirmed':'pending'}">${a.status}</span></td></tr>`;}).join('') || '<tr><td colspan="4" class="empty-state">لا توجد مواعيد اليوم</td></tr>'}

        </div>
      </div>

  `;
}

function renderReports(){
  const totalRevenue=invoices.filter(i=>i.status==='مدفوعة').reduce((s,i)=>s+i.total,0);
  const totalPending=invoices.filter(i=>i.status!=='مدفوعة').reduce((s,i)=>s+i.total,0);
  const activePatients=patients.filter(p=>p.status==='نشط').length;
  const totalSalary=staff.reduce((s,x)=>s+x.salary,0);
  const monthlyData=[{m:'يناير',v:8},{m:'فبراير',v:12},{m:'مارس',v:10},{m:'أبريل',v:15},{m:'مايو',v:18},{m:'يونيو',v:14},{m:'يوليو',v:20},{m:'أغسطس',v:22},{m:'سبتمبر',v:19},{m:'أكتوبر',v:25},{m:'نوفمبر',v:21},{m:'ديسمبر',v:28}];
  const maxM=Math.max(...monthlyData.map(x=>x.v));
  const html = `
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-ic ic-green">💰</div><div class="stat-val">${fmt(totalRevenue)}</div><div class="stat-lbl">إجمالي الإيرادات</div></div>
      <div class="stat-card"><div class="stat-ic ic-orange">⏳</div><div class="stat-val">${fmt(totalPending)}</div><div class="stat-lbl">مستحقات غير مدفوعة</div></div>
      <div class="stat-card"><div class="stat-ic ic-blue">👥</div><div class="stat-val">${activePatients}</div><div class="stat-lbl">مرضى نشطون</div></div>
      <div class="stat-card"><div class="stat-ic ic-purple">💼</div><div class="stat-val">${fmt(totalSalary)}</div><div class="stat-lbl">رواتب الموظفين</div></div>
    </div>
    <div class="chart-grid">
      <div class="chart-box">
        <h4>📈 الإيرادات الشهرية (بملايين الدنانير)</h4>
        <div class="bar-chart">
          ${monthlyData.map(x=>`<div class="bar-col"><div class="bar" style="height:${x.v/maxM*100}%"><span class="val">${x.v}</span></div><div class="bar-lbl">${x.m}</div></div>`).join('')}
        </div>
      </div>
      <div class="chart-box">
        <h4>📊 توزيع المرضى حسب التخصص</h4>
        <div class="legend">
          ${doctors.map(d=>`<div class="legend-item"><span class="legend-dot" style="background:${d.color}"></span>${d.specialty} (${d.patients} مريض)</div>`).join('')}
        </div>
      </div>
    </div>
    <div class="card">
      <div class="card-head"><h3>📤 تصدير البيانات</h3></div>
      <div class="card-body">
        <div class="btn-row">
          <button class="btn" onclick="exportCSV('patients')">📄 تصدير المرضى CSV</button>
          <button class="btn" onclick="exportCSV('appointments')">📄 تصدير المواعيد CSV</button>
          <button class="btn" onclick="exportCSV('invoices')">📄 تصدير الفواتير CSV</button>
          <button class="btn" onclick="window.print()">🖨️ طباعة التقرير</button>
        </div>
      </div>
    </div>
  `;

  const content = document.getElementById('content');
  if(!content) return;
  content.innerHTML = html;
}

function exportCSV(type){
  let rows = [];
  if(type==='patients') rows = patients.map(p=>[p.id,p.name,p.phone,p.gender,p.age,p.blood]);
  else if(type==='appointments') rows = appointments.map(a=>[a.id,a.patient,a.doctor,a.date,a.time,a.status]);
  else if(type==='invoices') rows = invoices.map(i=>[i.id,i.patient,i.amount,i.status,i.date]);
  const headers = type==='patients'?['الرقم','الاسم','الهاتف','الجنس','العمر','فصيلة الدم']
    : type==='appointments'?['الرقم','المريض','الطبيب','التاريخ','الوقت','الحالة']
    : ['الرقم','المريض','المبلغ','الحالة','التاريخ'];
  const csv = [headers.join(','), ...rows.map(r=>r.join(','))].join('\n');
  const blob = new Blob(['\ufeff'+csv], {type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = type+'_report.csv';
  a.click();
  showToast('تم تصدير الملف');
}

function mostPopularSpecialty(){
  const counts = {};
  doctors.forEach(d=>counts[d.specialty]=(counts[d.specialty]||0)+d.patients);
  return Object.entries(counts).sort((a,b)=>b[1]-a[1])[0][0];
}
function bestDoctor(){
  return doctors.slice().sort((a,b)=>b.patients-a.patients)[0].name;
}

function askAI(){
  const input = document.getElementById('aiInput');
  const q = input.value.trim();
  if(!q) return;
  const chat = document.getElementById('aiChat');
  chat.innerHTML += `<div class="chat-msg user">${q}</div>`;
  input.value='';
  const answer = generateAIAnswer(q);
  setTimeout(()=>{
    chat.innerHTML += `<div class="chat-msg bot">${answer}</div>`;
    chat.scrollTop = chat.scrollHeight;
  }, 500);
}

function generateAIAnswer(q){
  const s = q.toLowerCase();
  if(s.includes('مريض')||s.includes('مرضى')) return `لديك حالياً ${patients.length} مريض مسجل. ${patients.length>0?'أكثرهم: '+patients[0].name+' ('+patients[0].age+' سنة).':''}`;
  if(s.includes('موعد')||s.includes('مواعيد')) return `لديك ${appointments.length} موعد مسجل، منها ${appointments.filter(a=>a.status==='مؤكد').length} مؤكد.`;
  if(s.includes('إيراد')||s.includes('دخل')||s.includes('مال')) return `إجمالي الإيرادات ${invoices.reduce((s,i)=>s+i.amount,0)} دينار، منها ${invoices.filter(i=>i.status==='مدفوعة').length} فاتورة مدفوعة.`;
  if(s.includes('طبيب')||s.includes('دكتور')) return `لديك ${doctors.length} أطباء. الأفضل أداءً: ${bestDoctor()}.`;
  if(s.includes('تقرير')||s.includes('تحليل')) return `أفضل تخصص طلباً هو ${mostPopularSpecialty()}. يمكنك تصدير تقارير CSV من صفحة التقارير.`;
  return 'شكراً لسؤالك! يمكنني مساعدتك في معلومات المرضى، المواعيد، الإيرادات، الأطباء، والتقارير. جرّب سؤالاً مثل "كم عدد المرضى؟"';
}

function restoreData(){
  const input = document.createElement('input');
  input.type='file'; input.accept='.json';
  input.onchange = e=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      try{
        const data = JSON.parse(reader.result);
        if(data.patients) patients = data.patients;
        if(data.appointments) appointments = data.appointments;
        if(data.doctors) doctors = data.doctors;
        if(data.invoices) invoices = data.invoices;
        if(data.medications) medications = data.medications;
        if(data.staff) staff = data.staff;
        showToast('تم استعادة البيانات بنجاح');
        renderDashboard();
      }catch(err){ showToast('ملف غير صالح'); }
    };
    reader.readAsText(file);
  };
  input.click();
}

          <div class="form-group">
            <label>الكمية</label>
            <input type="number" id="medicineStock" value="100">
          </div>
          <div class="btn-row">
            <button class="btn btn-outline" onclick="closeModal()">إلغاء</button>
            <button class="btn btn-primary" onclick="saveMedicine()">💾 حفظ</button>
          </div>
        </div>
      </div>
    </div>
  `;
  document.getElementById('modal').innerHTML = html;
}

function saveMedicine(){
  const name = document.getElementById('medicineName').value;
  const price = parseFloat(document.getElementById('medicinePrice').value);
  const stock = parseInt(document.getElementById('medicineStock').value);
  if(!name || !price || !stock){
    alert('يرجى ملء جميع الحقول');
    return;
  }
  medications.push({
    id: medications.length+1,
    name: name,
    price: price,
    stock: stock
  });
  closeModal();
  renderMedications();
  showToast('تم إضافة الدواء');
}

/* ===== صفحة الموظفين ===== */
function renderStaff(){
  const html = `
  <div class="page">
    <div class="page-head">
      <h2>👥 الموظفين</h2>
      <p>إدارة الموظفين والأدوار</p>
    </div>
    <div class="card">
      <div class="card-head">
        <h3>قائمة الموظفين</h3>
        <button class="btn btn-primary" onclick="showAddStaffModal()">➕ إضافة موظف</button>
      </div>
      <div class="card-body">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>الرقم</th>
                <th>الاسم</th>
                <th>الوظيفة</th>
                <th>القسم</th>
                <th>الراتب</th>
                <th>الحالة</th>
                <th>الإجراءات</th>
              </tr>
            </thead>
            <tbody>
              ${staff.map(s=>`
                <tr>
                  <td>#${s.id}</td>
                  <td><div class="cell-user"><span class="avatar-sm" style="background:${s.color}">${s.name[0]}</span><span class="nm">${s.name}</span></div></td>
                  <td>${s.position}</td>
                  <td>${s.department}</td>
                  <td>${fmt(s.salary)} د.ع</td>
                  <td><span class="status ${s.status==='نشط'?'confirmed':'inactive'}">${s.status}</span></td>
                  <td>
                    <button class="btn btn-icon btn-outline" onclick="editStaff(${s.id})" title="تعديل">✏️</button>
                    <button class="btn btn-icon btn-danger" onclick="deleteStaff(${s.id})" title="حذف">🗑️</button>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
  `;
  const content = document.getElementById('content');
  if(!content) return;
  content.innerHTML = html;
}

function showAddStaffModal(){
  const html = `
    <div class="modal">
      <div class="modal-content">
        <div class="modal-head">
          <h3>👥 إضافة موظف جديد</h3>
          <button class="btn btn-icon btn-secondary" onclick="closeModal()">×</button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label>الاسم</label>
            <input type="text" id="staffName" placeholder="اكتب الاسم...">
          </div>
          <div class="form-group">
            <label>الوظيفة</label>
            <input type="text" id="staffPosition" placeholder="اكتب الوظيفة...">
          </div>
          <div class="form-group">
            <label>القسم</label>
            <select id="staffDepartment">
              <option>الإدارة</option>
              <option>المالية</option>
              <option>المختبرات</option>
              <option>السجلات</option>
              <option>الاستقبال</option>
            </select>
          </div>
          <div class="form-group">
            <label>الراتب الشهري</label>
            <input type="number" id="staffSalary" placeholder="اكتب الراتب...">
          </div>
          <div class="btn-row">
            <button class="btn btn-outline" onclick="closeModal()">إلغاء</button>
            <button class="btn btn-primary" onclick="saveStaff()">💾 حفظ</button>
          </div>
        </div>
      </div>
    </div>
  `;
  document.getElementById('modal').innerHTML = html;
}

function saveStaff(){
  const name = document.getElementById('staffName').value;
  const position = document.getElementById('staffPosition').value;
  const department = document.getElementById('staffDepartment').value;
  const salary = parseFloat(document.getElementById('staffSalary').value);
  if(!name || !position || !salary){
    alert('يرجى ملء جميع الحقول');
    return;
  }
  staff.push({
    id: staff.length+1,
    name: name,
    position: position,
    department: department,
    salary: salary,
    status: 'نشط',
    color: colors[staff.length % colors.length]
  });
  closeModal();
  renderStaff();
  showToast('تم إضافة الموظف');
}

function editStaff(id){
  const s = staff.find(st=>st.id===id);
  if(!s) return;
  const html = `
    <div class="modal">
      <div class="modal-content">
        <div class="modal-head">
          <h3>✏️ تعديل موظف</h3>
          <button class="btn btn-icon btn-secondary" onclick="closeModal()">×</button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label>الاسم</label>
            <input type="text" id="editStaffName" value="${s.name}">
          </div>
          <div class="form-group">
            <label>الوظيفة</label>
            <input type="text" id="editStaffPosition" value="${s.position}">
          </div>
          <div class="form-group">
            <label>القسم</label>
            <select id="editStaffDepartment">
              <option ${s.department==='الإدارة'?'selected':''}>الإدارة</option>
              <option ${s.department==='المالية'?'selected':''}>المالية</option>
              <option ${s.department==='المختبرات'?'selected':''}>المختبرات</option>
              <option ${s.department==='السجلات'?'selected':''}>السجلات</option>
              <option ${s.department==='الاستقبال'?'selected':''}>الاستقبال</option>
            </select>
          </div>
          <div class="form-group">
            <label>الراتب الشهري</label>
            <input type="number" id="editStaffSalary" value="${s.salary}">
          </div>
          <div class="btn-row">
            <button class="btn btn-outline" onclick="closeModal()">إلغاء</button>
            <button class="btn btn-primary" onclick="updateStaff(${id})">💾 تحديث</button>
          </div>
        </div>
      </div>
    </div>
  `;
  document.getElementById('modal').innerHTML = html;
}

function updateStaff(id){
  const s = staff.find(st=>st.id===id);
  if(!s) return;
  s.name = document.getElementById('editStaffName').value;
  s.position = document.getElementById('editStaffPosition').value;
  s.department = document.getElementById('editStaffDepartment').value;
  s.salary = parseFloat(document.getElementById('editStaffSalary').value);
  closeModal();
  renderStaff();
  showToast('تم تحديث الموظف');
}

function deleteStaff(id){
  if(!confirm('هل أنت متأكد من حذف هذا الموظف؟')) return;
  staff.splice(staff.findIndex(x=>x.id===id),1);
  renderStaff(); showToast('تم حذف الموظف');
}

/* ===== التهيئة ===== */
function updateNotifications(){
  const notifList = document.getElementById('notifList');
  if(!notifList) return;
  notifList.innerHTML = notifications.map(n=>`
    <div class="notif-item ${n.read?'':'unread'}">
      <span class="notif-icon">${n.icon}</span>
      <div class="notif-text">
        <p>${n.text}</p>
        <span>${n.time}</span>
      </div>
    </div>
  `).join('');
}

function init(){
  renderDashboard();
  updateNotifications();
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
